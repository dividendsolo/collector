name: CI

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5.1.0
      - name: Lockfile check (every action pinned to a commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension list | grep -q 'gh-actions-lock' || gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.1
      - name: The comment ban (tools/no-comments)
        run: bin/no-comments
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
