name: CI

# CI runs once per PR, right before the merge, and the merge waits for it
# (James, 2026-11-09: "the CI should run before merge, not after"). It starts
# by hand: agent-stack/vps/scripts/ci-merge.py starts it on the PR branch and
# merges only when it passes, and refuses a repo with no such workflow.
# A public repo runs on GitHub's free runners (Jog takes private repos only).
# Pushes do not run it (James, 2026-10-04: Actions minutes).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5.1.0
      - name: Lockfile check (every action pinned to a commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension list | grep -q 'gh-actions-lock' || gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
