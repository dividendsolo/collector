name: CI

# CI runs once per PR, right before the merge, and the merge waits for it
# (James, 2026-11-09: "the CI should run before merge, not after"). It starts
# by hand: agent-stack/vps/scripts/ci-merge.py starts it on the PR branch and
# merges only when it passes, and refuses a repo with no such workflow.
# A public repo runs on GitHub's free runners (Jog takes private repos only).
# Pushes do not run it (James, 2026-10-04: Actions minutes).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
